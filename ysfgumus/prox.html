<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProX — View once Photo Saver</title>
<meta name="description" content="ProX helps you save and keep photos, videos, audio messages and statuses you receive — including view once content — right on your device.">
<style>
  :root{--bg:#0d0f14;--border:#2a2f3c;--text:#eef1f6;--muted:#9aa3b2;--accent:#1769ff;--accent-2:#19b4ff}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
  .container{max-width:760px;margin:0 auto;padding:0 20px}
  main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;padding:70px 0}
  main::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 280px at 50% 10%,rgba(23,105,255,.22),transparent 70%);pointer-events:none}
  .app-icon{width:96px;height:96px;border-radius:24px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:2.7rem;margin:0 auto 26px;box-shadow:0 12px 36px rgba(23,105,255,.35)}
  h1{font-size:clamp(1.8rem,5vw,2.6rem);letter-spacing:-.5px;line-height:1.25;margin-bottom:16px}
  h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent-2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  p.lead{max-width:540px;margin:0 auto 32px;color:var(--muted);font-size:1.1rem}
  .btn{display:inline-block;padding:13px 30px;border-radius:12px;font-weight:600;text-decoration:none;background:var(--accent);color:#fff}
  .btn:hover{filter:brightness(1.12)}
  footer{border-top:1px solid var(--border);padding:26px 0;text-align:center;color:var(--muted);font-size:.9rem}
  footer a{color:var(--muted);text-decoration:none;margin:0 8px}
  footer a:hover{color:var(--text)}
</style>
</head>
<body>

<main>
  <div class="container">
    <div class="app-icon">📸</div>
    <h1>ProX<br><em>View once Photo Saver</em></h1>
    <p class="lead">Save and keep photos, videos, audio messages and statuses you receive in supported messaging apps — including “view once” content — right on your device.</p>
    <a class="btn" href="mailto:ysfgms3414@gmail.com?subject=ProX">Contact Us</a>
  </div>
</main>

<footer>
  <div class="container">
    <a href="/ysfgumus/prox-privacy.html">Privacy Policy</a> ·
    <a href="/ysfgumus/prox-support.html">Support</a> ·
    <a href="mailto:ysfgms3414@gmail.com">ysfgms3414@gmail.com</a><br><br>
    © 2026 Yusuf Gümüş — All Rights Reserved
  </div>
</footer>

</body>
</html>
