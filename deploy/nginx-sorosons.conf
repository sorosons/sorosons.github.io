# Host nginx vhost for sorosons.com
# Copy to /etc/nginx/sites-available/sorosons.com and symlink into sites-enabled.
# SSL is added automatically by: sudo certbot --nginx -d sorosons.com -d www.sorosons.com
server {
    listen 80;
    listen [::]:80;
    server_name sorosons.com www.sorosons.com;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
